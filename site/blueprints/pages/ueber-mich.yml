title: Ueber mich
icon: user

tabs:
  content:
    label: Inhalt
    columns:
      - width: 2/3
        fields:
          bio_paragraph_1:
            label: Bio Absatz 1
            type: textarea
            buttons: false
          bio_paragraph_2:
            label: Bio Absatz 2
            type: textarea
            buttons: false
      - width: 1/3
        sections:
          photo:
            type: files
            label: Profilbild
            layout: cards
            max: 1
            template: photo

  sections:
    label: Abschnitte
    fields:
      sections:
        label: Abschnitte
        type: structure
        sortable: true
        fields:
          section_title:
            label: Titel
            type: text
            required: true
            width: 1/2
          section_highlights:
            label: Hervorhebungen (optional)
            type: tags
            width: 1/2
            help: Woerter die hervorgehoben werden
          section_paragraphs:
            label: Absaetze
            type: structure
            fields:
              paragraph:
                label: Absatz
                type: textarea
                buttons: false

  cta:
    label: Kontakt-CTA
    fields:
      contact_cta_text:
        label: CTA Text (ueberschreibt global)
        type: textarea
        buttons: false
        help: Leer lassen fuer globalen Text

  seo:
    label: SEO
    fields:
      seo_title:
        label: Seitentitel
        type: text
      seo_description:
        label: Meta-Beschreibung
        type: textarea
        buttons: false
        maxlength: 160
