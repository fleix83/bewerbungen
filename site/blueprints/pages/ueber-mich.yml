title: Ueber mich
icon: user

tabs:
  content:
    label: Inhalt
    columns:
      - width: 2/3
        fields:
          bio_paragraph_1:
            label: Bio Absatz 1
            type: textarea
            buttons: false
          bio_paragraph_2:
            label: Bio Absatz 2
            type: textarea
            buttons: false
      - width: 1/3
        sections:
          photo:
            type: files
            label: Profilbild
            layout: cards
            max: 1
            template: photo

  languages:
    label: Sprachen
    fields:
      languages_title:
        label: Titel
        type: text
        default: "Sprachen"
      languages_text:
        label: Text
        type: textarea
        buttons: false
      languages_highlights:
        label: Hervorhebungen
        type: tags
        help: Woerter die hervorgehoben werden (z.B. Deutsch, Franzoesisch)

  ki:
    label: KI
    fields:
      ki_title:
        label: Titel
        type: text
        default: "KI"
      ki_paragraph_1:
        label: KI Absatz 1
        type: textarea
        buttons: false
      ki_paragraph_2:
        label: KI Absatz 2
        type: textarea
        buttons: false

  cta:
    label: Kontakt-CTA
    fields:
      contact_cta_text:
        label: CTA Text (ueberschreibt global)
        type: textarea
        buttons: false
        help: Leer lassen fuer globalen Text

  seo:
    label: SEO
    fields:
      seo_title:
        label: Seitentitel
        type: text
      seo_description:
        label: Meta-Beschreibung
        type: textarea
        buttons: false
        maxlength: 160
