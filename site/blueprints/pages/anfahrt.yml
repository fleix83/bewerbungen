title: Anfahrt
icon: pin

tabs:
  content:
    label: Inhalt
    fields:
      address_title:
        label: Adresse Titel
        type: text
        width: 1/3
      address:
        label: Adresse
        type: textarea
        buttons: false
        width: 2/3
        help: Verlinkt auf Google Maps (Link aus den Website-Einstellungen)
      address_note:
        label: Hinweis neben der Adresse
        type: textarea
        buttons: false
        help: Jede Zeile wird als eigene Zeile angezeigt
      sections:
        label: Abschnitte
        type: structure
        sortable: true
        fields:
          section_title:
            label: Titel
            type: text
            required: true
          section_text:
            label: Text
            type: textarea
            buttons: false
            help: Jede Zeile wird als eigene Zeile angezeigt
      highlights:
        label: Hervorgehobene Begriffe
        type: tags
        help: Diese Woerter erhalten in Tram/Auto einen weissen Hintergrund

  seo:
    label: SEO
    fields:
      seo_title:
        label: Seitentitel
        type: text
      seo_description:
        label: Meta-Beschreibung
        type: textarea
        buttons: false
        maxlength: 160
