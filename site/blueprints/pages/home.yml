title: Startseite
icon: home

tabs:
  content:
    label: Inhalt
    fields:
      hero_cta_text:
        label: Pitch Body Text
        type: textarea
        buttons: false
        help: Der Fliesstext unter den Pitch-Karten
      section2_card1_text:
        label: Pitch Karte 1 - Sprache
        type: textarea
        buttons: false
        help: Text für die Karte mit dem Sprach-Icon
      section2_card2_text:
        label: Pitch Karte 2 - Auffrischung
        type: textarea
        buttons: false
        help: Text für die Karte mit dem Update-Icon
      cta_subtitle:
        label: CTA Untertitel
        type: text
        default: "auch kurzfristig"

  services:
    label: Dienstleistungen
    fields:
      services_section_title:
        label: Titel
        type: text
        default: "Womit kann ich Ihnen helfen?"
      service_cards:
        label: Service-Karten
        type: structure
        sortable: true
        fields:
          name:
            label: Name
            type: text
            required: true
          description:
            label: Beschreibung
            type: textarea
            buttons: false
          time:
            label: Zeit
            type: text
            default: "max 1h"
            width: 1/4
          cost:
            label: Kosten
            type: text
            default: "30.00"
            width: 1/4
          cost_note:
            label: Kosten Zusatz
            type: text
            width: 1/4
            help: "z.B. 20.00 (Folgeschreiben online)"
          online:
            label: Online
            type: text
            default: "nicht möglich"
            width: 1/4
      location_title:
        label: Standort Titel
        type: text
        default: "Vorbeikommen oder online?"
      location_block1_title:
        label: Standort Block 1 - Titel
        type: text
        width: 1/2
      location_block1_text:
        label: Standort Block 1 - Text
        type: textarea
        buttons: false
        width: 1/2
      location_block2_title:
        label: Standort Block 2 - Titel
        type: text
        width: 1/2
      location_block2_text:
        label: Standort Block 2 - Text
        type: textarea
        buttons: false
        width: 1/2

  seo:
    label: SEO
    fields:
      seo_title:
        label: Seitentitel
        type: text
        help: Fuer Browser-Tab und Suchmaschinen
      seo_description:
        label: Meta-Beschreibung
        type: textarea
        buttons: false
        maxlength: 160
