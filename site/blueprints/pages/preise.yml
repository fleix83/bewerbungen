title: Preise & Angebote
icon: money

tabs:
  prices:
    label: Preise
    fields:
      price_items:
        label: Preisliste
        type: structure
        sortable: true
        fields:
          name:
            label: Dienstleistung
            type: text
            required: true
            width: 2/3
          price:
            label: Preis
            type: text
            required: true
            width: 1/3
            placeholder: "CHF 30.00"
      price_note:
        label: Hinweis zur Preisliste
        type: textarea
        buttons: false

  payment:
    label: Zahlung
    fields:
      payment_title:
        label: Titel
        type: text
        default: "Zahlungsmoeglichkeiten"
      payment_text:
        label: Text
        type: textarea
        buttons: false

  seo:
    label: SEO
    fields:
      seo_title:
        label: Seitentitel
        type: text
      seo_description:
        label: Meta-Beschreibung
        type: textarea
        buttons: false
        maxlength: 160
