title: Preise & Angebote
icon: money

tabs:
  prices:
    label: Preise
    fields:
      price_items:
        label: Preisliste
        type: structure
        sortable: true
        fields:
          name:
            label: Dienstleistung
            type: text
            required: true
            width: 2/3
          price:
            label: Preis
            type: text
            required: true
            width: 1/3
            placeholder: "CHF 30.00"
      price_note:
        label: Hinweis zur Preisliste
        type: textarea
        buttons: false

  additional:
    label: Zusatzleistungen
    fields:
      additional_services:
        label: Zusatzleistungen (inklusive)
        type: structure
        sortable: true
        fields:
          name:
            label: Leistung
            type: text
            required: true
      service_note:
        label: Hinweis zu Zusatzleistungen
        type: textarea
        buttons: false
      service_note_price:
        label: Zusatzkosten
        type: text
        placeholder: "CHF 10.00"

  payment:
    label: Zahlung
    fields:
      payment_title:
        label: Titel
        type: text
        default: "Zahlungsmoeglichkeiten"
      payment_text:
        label: Text
        type: textarea
        buttons: false
      payment_methods:
        label: Zahlungsmethoden (hervorgehoben)
        type: tags
        help: Woerter die hervorgehoben werden (z.B. Bar, TWINT)

  cta:
    label: Kontakt-CTA
    fields:
      contact_cta_text:
        label: CTA Text (ueberschreibt global)
        type: textarea
        buttons: false
        help: Leer lassen fuer globalen Text

  seo:
    label: SEO
    fields:
      seo_title:
        label: Seitentitel
        type: text
      seo_description:
        label: Meta-Beschreibung
        type: textarea
        buttons: false
        maxlength: 160
