<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex">
  <title>Klingel · Bewerbungen & Mehr</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; }
    body {
      min-height: 100dvh;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      gap: clamp(18px, 4.5vh, 40px);
      padding: 28px 24px;
      background: #ffffff; color: #000000;
      font-family: "Quicksand", system-ui, -apple-system, sans-serif;
      text-align: center;
      -webkit-tap-highlight-color: transparent;
    }

    /* --- Title --- */
    .title h1 {
      margin: 0;
      font-weight: 600;
      font-size: clamp(24px, 7vw, 34px);
      letter-spacing: .3px;
    }
    .title .name {
      margin: 4px 0 0;
      font-weight: 500;
      font-size: clamp(17px, 4.6vw, 22px);
    }

    /* --- Vintage doorbell (scaled design canvas, 440x659) --- */
    .bell-wrap {
      width: min(320px, 74vw);
      aspect-ratio: 1 / 1;
      position: relative;
    }
    .bell-stage {
      position: absolute; top: 0; left: 0;
      width: 480px; height: 480px;
      transform-origin: top left;
      cursor: pointer;
      user-select: none; -webkit-user-select: none;
      touch-action: manipulation;
    }
    .bell-stage img {
      position: absolute; inset: 0;
      width: 480px; height: 480px;
      display: block; pointer-events: none;
      -webkit-user-drag: none;
    }
    /* The pressable centre disc: a clipped copy of the same image that
       sinks in + dims when pressed. */
    .bell-btn {
      clip-path: circle(86px at 50% 50%);
      transform-origin: 50% 50%;
      transform: translateY(0) scale(1);
      filter: brightness(1);
      transition: transform 240ms cubic-bezier(0.34, 1.4, 0.64, 1),
                  filter 240ms ease-out;
    }
    /* Recessed shadow that appears over the button while pressed. */
    .bell-press {
      position: absolute;
      left: 50%; top: 50%;
      width: 175px; height: 175px;
      margin: -87.5px 0 0 -87.5px;
      border-radius: 50%;
      pointer-events: none;
      opacity: 0;
      box-shadow: inset 0 0 0 0 rgba(20, 12, 2, 0);
      transition: box-shadow 90ms ease-out, opacity 90ms ease-out;
    }
    .bell-stage.pressed .bell-btn {
      transform: translateY(5px) scale(0.95);
      filter: brightness(0.85);
    }
    .bell-stage.pressed .bell-press {
      opacity: 1;
      box-shadow: inset 0 6px 14px rgba(20, 12, 2, 0.5);
    }

    /* --- Ring-noise animation (only while ringing) --- */
    #wave {
      display: flex; justify-content: center;
      font-weight: 700;
      font-size: clamp(26px, 8vw, 42px);
      letter-spacing: 3px;
      color: #000000;
      min-height: 1.2em;
      opacity: 0;
      transition: opacity .25s ease;
    }
    #wave span { display: inline-block; opacity: .15; }
    #wave .sp { width: .5em; }
    #wave.on { opacity: 1; }
    #wave.on span { animation: wavepulse 1.1s ease-in-out infinite; }
    @keyframes wavepulse {
      0%, 100% { opacity: .15; transform: translateY(0) scaleY(1); }
      50%      { opacity: 1;   transform: translateY(-3px) scaleY(1.18); }
    }
  </style>
</head>
<body>
  <div class="title">
    <h1>Bewerbungen &amp; Mehr</h1>
    <p class="name">Felix Weissheimer</p>
  </div>

  <div class="bell-wrap">
    <div class="bell-stage" id="stage" role="button" tabindex="0" aria-label="Klingeln">
      <img class="bell-base" data-src="doorbell.jpg" alt="Vintage Türklingel">
      <img class="bell-btn" data-src="doorbell.jpg" alt="" aria-hidden="true">
      <div class="bell-press" aria-hidden="true"></div>
    </div>
  </div>

  <div id="wave" aria-hidden="true"></div>

  <audio id="ding" preload="auto"></audio>

  <script>
    const base = location.pathname.startsWith('/bewerbungen') ? '/bewerbungen' : '';
    const RING_URL = base + '/terminmanager/api/ring.php';
    const ASSET = base + '/terminmanager/doorbell/';

    const wrap  = document.querySelector('.bell-wrap');
    const stage = document.getElementById('stage');
    const waveEl = document.getElementById('wave');
    const ding  = document.getElementById('ding');

    // Resolve asset paths against the real directory (the page may be served
    // from the pretty /klingel URL, where relative paths would miss).
    document.querySelectorAll('img[data-src]').forEach(function (im) {
      im.src = ASSET + im.getAttribute('data-src');
    });
    ding.src = ASSET + 'ding-dong.mp3';

    // Scale the fixed 440x659 design canvas to fit its responsive wrapper.
    function fit() { stage.style.transform = 'scale(' + (wrap.clientWidth / 480) + ')'; }
    fit();
    window.addEventListener('resize', fit);
    window.addEventListener('load', fit);

    // Build the ring-noise wave "((( (((( ))))) )))" — each glyph pulses,
    // delayed by distance from the centre so the sound radiates outward.
    const WAVE = '((( (((( ))))) )))';
    const chars = Array.from(WAVE);
    const centre = (chars.length - 1) / 2;
    waveEl.innerHTML = chars.map((ch, i) => {
      if (ch === ' ') return '<span class="sp" aria-hidden="true"></span>';
      const delay = (Math.abs(i - centre) * 0.06).toFixed(2);
      return '<span style="animation-delay:' + delay + 's">' + ch + '</span>';
    }).join('');

    let busy = false;

    function fireRing() {
      if (busy) return;
      busy = true;

      // Local feedback for the visitor: ding-dong + radiating wave.
      try { ding.currentTime = 0; ding.play().catch(function () {}); } catch (e) {}
      waveEl.classList.add('on');

      // Notify Felix (fire-and-forget; the visitor needs no status text).
      fetch(RING_URL, { method: 'POST' }).catch(function () {});

      // Wave plays for a few rings, then fades; button re-arms after cooldown.
      setTimeout(function () { waveEl.classList.remove('on'); }, 4200);
      setTimeout(function () { busy = false; }, 10000);
    }

    stage.addEventListener('pointerdown', function () { if (!busy) stage.classList.add('pressed'); });
    ['pointerup', 'pointerleave', 'pointercancel'].forEach(function (ev) {
      stage.addEventListener(ev, function () { stage.classList.remove('pressed'); });
    });
    stage.addEventListener('click', fireRing);
    stage.addEventListener('keydown', function (e) {
      if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); fireRing(); }
    });
  </script>
</body>
</html>
